packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - packages/*
  - scripts

autoInstallPeers: false
strictPeerDependencies: true

# Keep local and CI installs on the same isolated virtual-store layout.
enableGlobalVirtualStore: false

# Delay newly published packages for 24 hours to reduce supply-chain exposure.
minimumReleaseAge: 1440

catalog:
  "@replit/vite-plugin-cartographer": ^0.6.1
  "@replit/vite-plugin-dev-banner": ^0.1.1
  "@replit/vite-plugin-runtime-error-modal": ^0.0.6
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.101.4
  "@types/node": 26.5.1
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.1.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^13.1.1
  lucide-react: ^1.33.0
  react: 19.3.0
  react-dom: 19.2.8
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.12
  vite: ^8.2.2
  wouter: ^3.3.5
  zod: ^4.4.3

overrides:
  "@esbuild-kit/esm-loader": npm:tsx@^4.23.12
  fast-uri: 3.1.5
  form-data: 4.0.6
  typescript: 5.9.3
  ws: 8.21.0

allowBuilds:
  "@google/genai": false # The package declares a no-op preinstall script.
  "@swc/core": true
  esbuild: true
  msw: false
  protobufjs: true
  unrs-resolver: true
